# Weekly dependency updates, one grouped pull request per ecosystem, against `development`.
# How these pull requests fit the workflow: CLAUDE.md, "Git workflow".
#
# Every ecosystem ignores major versions: a major is deliberate work (migrations, breaking
# changes), done as a task when it is needed. An `ignore` rule with only `update-types` does
# not apply to security updates, so a vulnerability fixed only in a new major still gets a
# security pull request.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /api/Beacon.Api
      - /api/Beacon.Tests
      - /scripts/SeedRunner
    schedule:
      interval: weekly
    target-branch: development
    commit-message:
      prefix: chore
    groups:
      nuget:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: development
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      # Security updates are one PR per package unless a group applies to them. The Angular
      # packages require each other at exactly the same version, so a fix for one installs
      # only together with the rest.
      angular-security:
        applies-to: security-updates
        patterns: ['@angular/*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Each Angular release supports a narrow TypeScript range, so TypeScript moves with
      # Angular (`ng update`), not on its own.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: development
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
