name: CI

on:
  push:
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # `dotnet list package --vulnerable` exits 0 whatever it finds, so read its report.
      # scripts/SeedRunner is not in beacon.sln and is listed on its own.
      - name: Check for vulnerable NuGet packages
        run: |
          for project in beacon.sln scripts/SeedRunner; do
            dotnet list "$project" package --vulnerable --include-transitive | tee -a vulnerable.txt
          done
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the report above)."
            exit 1
          fi
      - name: Check formatting (fix with `dotnet format beacon.sln`)
        run: dotnet format beacon.sln --verify-no-changes
      - name: Test
        working-directory: api
        run: dotnet test Beacon.Tests/ --nologo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Check for vulnerable npm packages (high or critical)
        run: npm audit --audit-level=high
      - name: Check formatting (fix with `npx prettier --write .`)
        run: npx prettier --check .
      - name: Test
        run: npx ng test --watch=false
      - name: Build (production budgets enforced)
        run: npm run build
