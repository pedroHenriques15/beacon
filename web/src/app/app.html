<div class="layout">
  <nav class="sidebar" [class.sidebar--collapsed]="!sidebarOpen()">
    <div class="sidebar__logo">
      @if (sidebarOpen()) {
        <a class="sidebar__logo-text" routerLink="/dashboard">Finance Hub</a>
        <button class="sidebar__toggle" (click)="toggleSidebar()" title="Collapse sidebar">
          ‹
        </button>
      } @else {
        <button class="sidebar__toggle" (click)="toggleSidebar()" title="Expand sidebar">›</button>
      }
    </div>

    <a
      class="sidebar__link"
      routerLink="/dashboard"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Dashboard' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      @if (sidebarOpen()) {
        Dashboard
      }
    </a>

    <a
      class="sidebar__link"
      routerLink="/transactions"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Transactions' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="8" y1="6" x2="21" y2="6" />
        <line x1="8" y1="12" x2="21" y2="12" />
        <line x1="8" y1="18" x2="21" y2="18" />
        <line x1="3" y1="6" x2="3.01" y2="6" />
        <line x1="3" y1="12" x2="3.01" y2="12" />
        <line x1="3" y1="18" x2="3.01" y2="18" />
      </svg>
      @if (sidebarOpen()) {
        Transactions
      }
    </a>

    <a
      class="sidebar__link"
      routerLink="/analytics"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Analytics' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
        <path d="M22 12A10 10 0 0 0 12 2v10z" />
      </svg>
      @if (sidebarOpen()) {
        Analytics
      }
    </a>

    <a
      class="sidebar__link"
      routerLink="/rules"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Rules' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
      @if (sidebarOpen()) {
        Rules
      }
    </a>

    <a
      class="sidebar__link"
      routerLink="/salary"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Salary' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="1" x2="12" y2="23" />
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
      </svg>
      @if (sidebarOpen()) {
        Salary
      }
    </a>

    <a
      class="sidebar__link"
      routerLink="/upload"
      routerLinkActive="active"
      [title]="!sidebarOpen() ? 'Upload' : ''"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      @if (sidebarOpen()) {
        Upload
      }
    </a>
  </nav>
  <main class="content">
    <div class="page-inner">
      <router-outlet />
    </div>
  </main>
</div>
