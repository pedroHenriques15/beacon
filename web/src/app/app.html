<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/dashboard" aria-label="Beacon, home">
      <svg
        class="brand__icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="2.6" fill="currentColor" />
        <path d="M6.6 6.6a7.6 7.6 0 0 0 0 10.8M17.4 6.6a7.6 7.6 0 0 1 0 10.8" />
      </svg>
      <span class="brand__name">Beacon</span>
    </a>
    <p class="topbar__title">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="2.6" fill="currentColor" />
        <path d="M6.6 6.6a7.6 7.6 0 0 0 0 10.8M17.4 6.6a7.6 7.6 0 0 1 0 10.8" />
      </svg>
      {{ pageLabel() }}
    </p>

    <nav class="pill-nav" aria-label="Sections">
      @for (item of desktopNav; track item.path) {
        <a
          class="pill-nav__link"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="topbar__actions">
      <a
        class="btn-icon topbar__settings"
        routerLink="/settings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        aria-label="Settings"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="icons.settings" />
        </svg>
      </a>
      <a class="btn-primary topbar__upload" routerLink="/upload">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 16V4M7 9l5-5 5 5M5 20h14" />
        </svg>
        Upload PDF
      </a>
      <button
        type="button"
        class="btn-icon topbar__more"
        aria-label="More"
        aria-haspopup="dialog"
        [attr.aria-expanded]="moreOpen()"
        (click)="toggleMore()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M5 12h.01M12 12h.01M19 12h.01" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

@if (!onUploadPage()) {
  <a class="fab" routerLink="/upload" aria-label="Upload PDF">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 16V4M7 9l5-5 5 5M5 20h14" />
    </svg>
  </a>
}

<nav class="bottom-nav" aria-label="Sections">
  @for (item of mainNav; track item.path) {
    <a
      class="bottom-nav__link"
      [routerLink]="item.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <span class="bottom-nav__icon">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="item.icon" />
        </svg>
      </span>
      {{ item.label }}
    </a>
  }
</nav>

@if (moreOpen()) {
  <div class="modal-overlay more-overlay" (click)="closeMore()">
    <div
      class="modal more-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="more-title"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h3 id="more-title">More</h3>
        <button type="button" class="modal-close" aria-label="Close" (click)="closeMore()">
          ✕
        </button>
      </div>
      <ul class="more-list">
        @for (item of moreNav; track item.path) {
          <li>
            <a
              class="more-list__link"
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMore()"
            >
              <span class="more-list__icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path [attr.d]="item.icon" />
                </svg>
              </span>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
}
