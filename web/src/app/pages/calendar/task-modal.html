@if (open) {
  <div class="modal-overlay" (click)="onCancel()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ task ? 'Edit Task' : 'New Task' }}</h3>
        <button class="modal-close" (click)="onCancel()" type="button">&#x2715;</button>
      </div>

      <label class="field-label" for="task-title">Title</label>
      <input
        id="task-title"
        class="field-input"
        type="text"
        placeholder="Task title"
        [(ngModel)]="form.title"
        name="title"
      />

      @if (taskLists.length > 1) {
        <label class="field-label" for="task-list">List</label>
        <select id="task-list" class="field-input" [(ngModel)]="form.taskListId" name="taskListId">
          @for (list of taskLists; track list.id) {
            <option [value]="list.id">{{ list.title }}</option>
          }
        </select>
      }

      <label class="field-label" for="task-due">Due date</label>
      <input id="task-due" class="field-input" type="date" [(ngModel)]="form.due" name="due" />

      <label class="field-label" for="task-notes">Notes</label>
      <textarea
        id="task-notes"
        class="field-input task-textarea"
        placeholder="Optional notes"
        [(ngModel)]="form.notes"
        name="notes"
        rows="3"
      ></textarea>

      @if (task) {
        <div class="task-completed-row">
          <label class="field-label" for="task-completed">Completed</label>
          <input
            id="task-completed"
            type="checkbox"
            [(ngModel)]="form.completed"
            name="completed"
          />
        </div>
      }

      @if (saveError) {
        <p class="modal-error">{{ saveError }}</p>
      }

      <div class="modal-actions">
        @if (task) {
          <button class="btn-danger" type="button" (click)="onDelete()" [disabled]="saving">
            Delete
          </button>
        }
        <div class="task-actions-right">
          <button class="btn-secondary" type="button" (click)="onCancel()">Cancel</button>
          <button
            class="btn-primary"
            type="button"
            (click)="onSave()"
            [disabled]="saving || !form.title.trim()"
          >
            {{ saving ? 'Saving…' : 'Save' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
