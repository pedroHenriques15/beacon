@if (showShare()) {
  <div class="share" role="img" [attr.aria-label]="shareLabel()">
    @for (row of bars().rows; track (row.side ?? '') + row.label) {
      @if (row.share > 0) {
        <span
          class="share__seg"
          [style.flex-grow]="row.share"
          [style.background]="row.color"
          [title]="row.label + ', ' + eur(row.total)"
        ></span>
      }
    }
  </div>
}

<div class="bars">
  <div class="bars__head" aria-hidden="true">
    <span>Category</span>
    <span class="num">Share</span>
    <span class="bars__axis">
      @for (t of bars().ticks; track $index) {
        <span>{{ eurAxis(t) }}</span>
      }
    </span>
    <span class="num">{{ current() }}</span>
  </div>
  <ul class="bars__list">
    @for (row of bars().rows; track (row.side ?? '') + row.label) {
      <li>
        <button
          type="button"
          class="bar-row"
          [attr.aria-pressed]="isSelected(row)"
          [attr.aria-label]="rowLabel(row)"
          (click)="picked.emit(row)"
        >
          <span class="bar-row__name">
            @if (row.label === unknown) {
              <span class="ring"></span>
            } @else {
              <span class="cat-dot" [style.--_dot]="row.color"></span>
            }
            <span class="bar-row__text">
              <span class="bar-row__label">{{ row.label }}</span>
              @if (row.detail) {
                <span class="bar-row__detail">{{ row.detail }}</span>
              }
            </span>
          </span>
          <span class="bar-row__share">{{ row.share.toFixed(1) }}%</span>
          <span class="bar-row__track">
            <span
              class="bar-row__bar"
              [style.width.%]="row.pct"
              [style.background]="row.color"
            ></span>
          </span>
          <span class="bar-row__amount" [class.amount-in]="row.side === 'in' && row.total > 0">{{
            amount(row)
          }}</span>
        </button>
      </li>
    }
  </ul>
</div>
