@if (open) {
  <div class="modal-overlay" (click)="cancelled.emit()">
    <div
      class="modal confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <h3 id="confirm-dialog-title">{{ title }}</h3>
        <button type="button" class="modal-close" aria-label="Close" (click)="cancelled.emit()">
          ✕
        </button>
      </div>
      <p id="confirm-dialog-message" class="confirm-dialog__message">{{ message }}</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="button" class="btn-danger" (click)="confirmed.emit()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
