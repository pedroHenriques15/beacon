@if (open) {
  <div class="modal-overlay" (click)="cancelled.emit()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ title }}</h3>
        <button class="modal-close" (click)="cancelled.emit()">✕</button>
      </div>
      <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem">{{ message }}</p>
      <div class="modal-actions">
        <button class="btn-secondary" (click)="cancelled.emit()">Cancel</button>
        <button class="btn-danger" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
